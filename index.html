<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <span>PONTOS: <strong id="score">0</strong></span>
      <span>VIDAS: <strong id="lives">3</strong></span>
      <span>FASE: <strong id="level">1</strong></span>
    </div>
    <canvas id="canvas"></canvas>
    <div id="overlay" class="visible">
      <h1>SPACE INVADERS</h1>
      <p>Use <kbd>←</kbd> <kbd>→</kbd> para mover e <kbd>Espaço</kbd> para atirar</p>
      <button id="start-btn">INICIAR JOGO</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
